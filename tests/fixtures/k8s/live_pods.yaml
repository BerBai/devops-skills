apiVersion: v1
kind: Pod
metadata:
  name: healthy-pod
  labels:
    app: healthy-pod
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-pod
  labels:
    app: crashloop-pod
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'about to die' >&2; exit 1"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: pending-pod
  labels:
    app: pending-pod
spec:
  restartPolicy: Always
  nodeSelector:
    kubernetes.io/hostname: nonexistent-node-xyz
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
