# Vale configuration for the documentation surface.
#
# The built-in `Vale` style is used (no downloaded package): Spelling +
# Repetition + the rest of Vale's default prose rules. `Vale.Terms` is off
# because this corpus deliberately uses both `SSH` and `ssh` (the command vs the
# product) and `Vale.Terms` would force one casing everywhere.
#
# The vocabulary is the reviewable list of product names, command flags and
# code identifiers that would otherwise be reported as misspellings. Add a word
# here only when it is a real term; do not add prose typos.
#
# Run:
#   npx --yes --package @vvago/vale@3.25.1 vale --config .vale.ini <paths>

StylesPath = .vale/styles
MinAlertLevel = error
Vocab = devops

[*.md]
BasedOnStyles = Vale
Vale.Terms = NO
